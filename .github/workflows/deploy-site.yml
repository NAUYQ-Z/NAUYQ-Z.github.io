name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 取回站点包并解压
        env:
          BUNDLE: https://aka.doubaocdn.com/s/JJ4xTpgye6
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/site.zip "$BUNDLE"
          ls -lh /tmp/site.zip
          python3 - <<'PY'
          import os, shutil, zipfile
          src = '/tmp/site.zip'
          out = 'site'
          shutil.rmtree(out, ignore_errors=True)
          os.makedirs(out)
          with zipfile.ZipFile(src) as z:
              for n in z.namelist():
                  p = n.replace('\\', '/').lstrip('/')
                  for pref in ('pwa/', 'tarot-pwa/'):
                      if p.startswith(pref):
                          p = p[len(pref):]
                  if not p or n.endswith('/'):
                      continue
                  dst = os.path.join(out, p)
                  os.makedirs(os.path.dirname(dst) or out, exist_ok=True)
                  with open(dst, 'wb') as f:
                      f.write(z.read(n))
          print('files:', sum(len(fs) for _, _, fs in os.walk(out)))
          PY
          test -f site/index.html
          test -f site/manifest.json
          test -f site/js/app.js
          test -f site/assets/cards/m00.webp
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
