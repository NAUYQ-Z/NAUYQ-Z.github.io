name: sync-site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-site
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 取回站点包并写回仓库
        env:
          BUNDLE: https://aka.doubaocdn.com/s/JJ4xTpgye6
        run: |
          set -euo pipefail
          curl -fsSL "$BUNDLE" -o /tmp/site.zip
          ls -lh /tmp/site.zip
          unzip -q /tmp/site.zip -d /tmp/unz
          if [ -d /tmp/unz/pwa ]; then SRC=/tmp/unz/pwa; else SRC=/tmp/unz; fi
          echo "bundle root: $SRC"
          test -f "$SRC/index.html"
          rsync -a --delete \
            --exclude '.git' --exclude '.github' \
            --exclude 'README.md' --exclude '.nojekyll' --exclude 'test' \
            "$SRC"/ ./
          git config user.name "tarot-sync"
          git config user.email "tarot-sync@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "sync: 站点文件更新"
            git push
          fi
