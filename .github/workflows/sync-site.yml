name: sync-site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-site
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 取回站点包并写回仓库
        env:
          BUNDLE: https://aka.doubaocdn.com/s/tFnaXOQr0c
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/site.zip "$BUNDLE"
          ls -lh /tmp/site.zip
          python3 - <<'PY'
          import os, shutil, zipfile
          src = '/tmp/site.zip'
          out = '/tmp/site'
          shutil.rmtree(out, ignore_errors=True)
          os.makedirs(out)
          with zipfile.ZipFile(src) as z:
              for n in z.namelist():
                  p = n.replace('\\', '/').lstrip('/')
                  for pref in ('pwa/', 'tarot-pwa/'):
                      if p.startswith(pref):
                          p = p[len(pref):]
                  if not p or n.endswith('/'):
                      continue
                  dst = os.path.join(out, p)
                  os.makedirs(os.path.dirname(dst) or out, exist_ok=True)
                  with open(dst, 'wb') as f:
                      f.write(z.read(n))
          print('files extracted:', sum(len(fs) for _, _, fs in os.walk(out)))
          PY
          test -f /tmp/site/index.html
          test -f /tmp/site/manifest.json
          test -f /tmp/site/js/app.js
          test -f /tmp/site/assets/cards/m00.webp
          rsync -a --delete \
            --exclude '.git' --exclude '.github' \
            --exclude 'README.md' --exclude '.nojekyll' \
            /tmp/site/ ./
          git config user.name "tarot-sync"
          git config user.email "tarot-sync@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "sync: 站点文件更新"
            git push
          fi
