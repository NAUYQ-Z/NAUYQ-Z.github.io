<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<title>塔罗笔记</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="description" content="本地离线的塔罗笔记：抽牌、记录、回头看。" />
<meta name="theme-color" content="#EDE8DC" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#14120F" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="塔罗笔记" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/app.css" />
<script>
/* 首帧就把主题定下来：只读 localStorage 镜像（同步），不碰 IndexedDB，
   打开时不会先闪一下纸色再变深色，也没有一次布局重排。 */
(function () {
  try {
    var m = localStorage.getItem('tarot.theme') || 'auto';
    var dark = m === 'dark' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    if (localStorage.getItem('tarot.motion') === 'off') document.documentElement.classList.add('no-motion');
  } catch (e) { /* 隐私模式下读不到就用默认纸色 */ }
})();
</script>
</head>
<body>
  <div id="app"></div>
  <div id="sheet-root"></div>
  <div id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views.js"></script>
</body>
</html>
